<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tree Service Jacksonville NC | Godhans Tree Company</title>
    <meta name="author" content="Godhans Tree Company" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Canonical, description, og:url are injected per-route by react-helmet. Do NOT hardcode them here or duplicates will appear in page source. -->

    <!-- Geo / Local SEO meta tags -->
    <meta name="geo.region" content="US-NC" />
    <meta name="geo.placename" content="Jacksonville, North Carolina" />
    <meta name="geo.position" content="34.7541;-77.4302" />
    <meta name="ICBM" content="34.7541, -77.4302" />

    <!-- Content Security Policy: restrict third-party script/frame sources to known ARC Affiliates domain -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://link.arcaffiliates.com; frame-src 'self' https://link.arcaffiliates.com; connect-src 'self' https: wss:; img-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https: data:; object-src 'none'; base-uri 'self';" />

    <!-- Preconnect to external domains for faster loading -->
    <link rel="preconnect" href="https://link.arcaffiliates.com">
    <link rel="dns-prefetch" href="https://link.arcaffiliates.com">
    
    <style>
      /* Ensure text remains visible during font load */
      @font-face {
        font-family: system-ui;
        font-display: swap;
      }
    </style>

    <!-- og:title, og:description, og:url are injected per-route by react-helmet -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://godhans.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Godhans Tree Company" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@godhanstree" />
    <meta name="twitter:image" content="https://godhans.com/og-image.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
