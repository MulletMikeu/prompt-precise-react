<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Per-route page title, meta description and canonical link are injected
         at build time by each page via vite-react-ssg Head. Do NOT add a static
         title or description tag here, or every page would share the same one. -->
    <meta name="author" content="Godhans Tree Company" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <meta name="geo.region" content="US-NC" />
    <meta name="geo.placename" content="Jacksonville, North Carolina" />
    <meta name="geo.position" content="34.7541;-77.4302" />
    <meta name="ICBM" content="34.7541, -77.4302" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Godhans Tree Company" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://godhans.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Godhans Tree Company — Veteran-owned tree service in Jacksonville, NC" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@godhanstree" />
    <meta name="twitter:image" content="https://godhans.com/og-image.jpg" />

    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png?v=3" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png?v=3" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />


    <!-- Self-hosted fonts: see the @font-face block in src/index.css for why.
         Preload is the above-fold face only (hero H1 = .text-display-2xl).
         crossorigin is required even same-origin or it double-fetches. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/barlow-condensed-800.woff2" crossorigin />

    <style>
      html { background: #0a0a0a; }
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
